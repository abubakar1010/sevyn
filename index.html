<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sevyn</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2f3f9e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem('sevyn-theme')
        if (
          t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        )
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
